[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alptugharun-ai-workbench-mcp"
version = "0.1.0a2"
description = "A dependency-free, read-only MCP server for reusable AI prompts and assistant blueprints."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Alptuğ Harun" }
]
keywords = ["mcp", "model-context-protocol", "ai", "prompts", "assistants", "agent-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks"
]

[project.scripts]
alptugharun-ai-workbench-mcp = "ai_workbench_mcp.server:main"

[project.urls]
Homepage = "https://github.com/alptugharun/ai-workbench-mcp"
Repository = "https://github.com/alptugharun/ai-workbench-mcp"
Issues = "https://github.com/alptugharun/ai-workbench-mcp/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_workbench_mcp = ["catalog.json"]
