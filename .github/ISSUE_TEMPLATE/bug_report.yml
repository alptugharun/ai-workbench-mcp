name: Bug report
description: Report a reproducible problem in the MCP server.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make this project more reliable.
        Start with `alptugharun-ai-workbench-mcp --doctor` and use public-safe data only.
        A passing doctor result proves the local package/catalog layer, not host discovery or tool invocation.
  - type: input
    id: version
    attributes:
      label: Package version or commit
      description: Output of --version, a tag, or commit SHA.
      placeholder: "0.1.0a2"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, MCP host/client name and exact host version.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Paste the public-safe JSON from alptugharun-ai-workbench-mcp --doctor.
      render: json
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: First failing layer
      options:
        - Package install / command discovery
        - Local doctor/catalog load
        - MCP handshake
        - Host discovery / tools do not appear
        - Tool invocation
        - Output / acceptance check
        - Not sure
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Exact commands or host steps using synthetic/public-safe input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the smallest useful error excerpt. Remove secrets and private data.
    validations:
      required: true
  - type: checkboxes
    id: discovery
    attributes:
      label: Discovery evidence
      options:
        - label: The host showed list_prompts.
        - label: The host showed render_prompt.
        - label: The host showed get_assistant.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed tokens, cookies, private files, client data, private paths, and other secrets.
          required: true
        - label: I checked TROUBLESHOOTING.md and existing issues/discussions for the same problem.
          required: true
